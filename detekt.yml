# Detekt profile (built upon the default config; see the tgvd.kmp / tgvd.compose.js / tgvd.jvm
# convention plugins and convention-plugins/src/main/kotlin/StaticAnalysis.kt). Static analysis
# covers test source sets too — tests are about a third of the codebase and are where copy-paste
# accumulates fastest.
#
# Test *support* code, though, is a different shape from production code: object mothers take one
# parameter per field on purpose (that is what makes call sites readable), and a support file
# legitimately holds several small declarations. Relaxing those rules for fixtures/fakes — and for
# the whole domain-test-fixtures module — keeps the gate meaningful for real test logic instead of
# turning it into noise everyone learns to ignore.
complexity:
  LongParameterList:
    functionThreshold: 8    # use-cases often have many deps
    excludes: &testSupport
      - '**/src/*Test/kotlin/**/fixtures/**'
      - '**/src/*Test/kotlin/**/fakes/**'
      - '**/src/test/kotlin/**/fixtures/**'
      - '**/src/test/kotlin/**/fakes/**'
      - '**/src/test/kotlin/**/Fakes.kt'
      - '**/*TestSupport.kt'
      - '**/src/*Test/kotlin/**/Fake*.kt'
      - '**/src/test/kotlin/**/Fake*.kt'
      - '**/domain-test-fixtures/**'
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15     # API facades / ViewModels group related calls
    thresholdInInterfaces: 15

style:
  MagicNumber:
    active: false            # domain value classes handle this
  ReturnCount:
    excludes: *testSupport
    # Guard clauses are the clearest way to state a precondition; counting them towards the limit
    # would push the code towards nested ifs, which is the thing the rule exists to prevent.
    excludeGuardClauses: true

naming:
  FunctionNaming:
    active: false            # operator fun invoke() and Compose PascalCase functions are fine
  MatchingDeclarationName:
    excludes: *testSupport

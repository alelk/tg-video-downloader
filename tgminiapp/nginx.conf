# nginx site config for the Mini App static bundle.
#
# Why: without an explicit Cache-Control, WebViews (Telegram iOS) apply *heuristic* caching based on
# Last-Modified and may keep index.html / tgminiapp.js for days. The bundle files have no content
# hash in their names (except the .wasm), so they must be revalidated on every load.
# `no-cache` still allows a cheap 304 via ETag — it only forbids using a copy without revalidation.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    etag on;

    # Default for everything (index.html, config.js, tgminiapp.js, skiko.*, composeResources, *.map):
    # always revalidate.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed files (webpack names them by hash) are safe to cache forever.
    location ~* "^/[0-9a-f]{20}\.wasm$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
